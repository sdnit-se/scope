[tools]
node = "26.12.1"
yarn = "4.18.1"

[tasks.install]
description = "Install workspace dependencies"
run = "yarn install --immutable"

[tasks."enterprise:check"]
description = "List files under Twenty's Enterprise licence; pass --max <count> to allow some"
run = "scripts/check-no-enterprise-code.sh"

[tasks."shared:build"]
description = "Build twenty-shared, which other packages import from dist"
run = "npx nx build twenty-shared"

[tasks."check:shared"]
description = "Lint, typecheck and test twenty-shared"
depends = ["shared:build"]
env = { NODE_OPTIONS = "--max-old-space-size=4096" }
run = "npx nx run-many -t lint typecheck test -p twenty-shared"

[tasks."check:front"]
description = "Lint, typecheck and build twenty-front"
depends = ["shared:build"]
env = { NODE_OPTIONS = "--max-old-space-size=10240" }
run = [
  "test -f packages/twenty-front/.env || npx nx reset:env twenty-front",
  "npx nx run-many -t lint typecheck -p twenty-front",
  "npx nx build twenty-front",
]

[tasks."test:front"]
description = "Run twenty-front unit tests, optionally one shard such as 1/3"
depends = ["shared:build"]
env = { NODE_OPTIONS = "--max-old-space-size=6144" }
usage = 'arg "[shard]" default="1/1"'
run = [
  "test -f packages/twenty-front/.env || npx nx reset:env twenty-front",
  "npx nx test twenty-front --shard=${usage_shard}",
]

[tasks."check:server"]
description = "Lint, typecheck and build twenty-server"
depends = ["shared:build"]
run = [
  "test -f packages/twenty-server/.env || npx nx reset:env twenty-server",
  "npx nx run-many -t lint typecheck -p twenty-server",
  "npx nx build twenty-server",
]

[tasks."test:server"]
description = "Run twenty-server unit tests, optionally one shard such as 1/4"
depends = ["shared:build"]
usage = 'arg "[shard]" default="1/1"'
run = "npx nx run twenty-server:test:ci --shard=${usage_shard}"

[tasks."test:server-integration"]
description = "Reset the test databases of .env.test (PostgreSQL test, ClickHouse twenty) and run the server integration suites for sign-in, permissions, records, webhooks, workflows, app functions, file uploads, e-mail sending and inbound mail with billing off, optionally one shard such as 1/4; needs PostgreSQL, Redis, ClickHouse and psql"
dir = "packages/twenty-server"
usage = 'arg "[shard]" default="1/1"'
env = { NODE_ENV = "test", IS_BILLING_ENABLED = "false" }
run = [
  "npx nx build twenty-server",
  "psql postgres://postgres:postgres@localhost:5432/postgres -tAc \"SELECT 1 FROM pg_database WHERE datname = 'test'\" | grep -q . || psql postgres://postgres:postgres@localhost:5432/postgres -c 'CREATE DATABASE test'",
  "npx nx clickhouse:migrate twenty-server",
  "NODE_OPTIONS=--max-old-space-size=12288 npx nx database:reset twenty-server --excludeTaskDependencies",
  '''
  NODE_OPTIONS=--max-old-space-size=6144 npx jest --config ./jest-integration.config.ts --shard=${usage_shard} \
    test/integration/graphql/suites/auth/ test/integration/graphql/suites/auth.integration-spec \
    test/integration/rest/suites/rest-api-core-authentication test/integration/metadata/suites/developers/ \
    test/integration/graphql/suites/object-records-permissions/ test/integration/graphql/suites/settings-permissions/ \
    test/integration/graphql/suites/role/ test/integration/graphql/suites/application-role-intersection/ \
    test/integration/metadata/suites/role/ test/integration/metadata/suites/role-permission-flag/ \
    test/integration/metadata/suites/object-permission/ test/integration/metadata/suites/field-permission/ \
    test/integration/metadata/suites/application-default-role/ test/integration/metadata/suites/logic-function/ \
    test/integration/rest/suites/field-permissions test/integration/rest/suites/rest-api-depth-relation-field-permissions \
    test/integration/graphql/suites/object-generated/ test/integration/rest/suites/rest-api-core-create- \
    test/integration/graphql/suites/workflow/ test/integration/resend/ test/integration/aws/ \
    test/integration/graphql/suites/file-upload/ test/integration/workflow-actions/send-email/
  ''',
]
