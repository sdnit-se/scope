name: Scope CI

# Never add pull_request or pull_request_target: Scope is public, and only
# people with write access may run code here. Their branches trigger push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Lower this as each area is removed; it reaches 0 when the work is done.
  ENTERPRISE_FILES_MAX: 476

jobs:
  enterprise-code:
    if: github.repository == 'sdnit-se/scope'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: 2026.10.23
          install: false
      - run: mise run enterprise:check --max "$ENTERPRISE_FILES_MAX"

  check:
    if: github.repository == 'sdnit-se/scope'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package: [shared, front, server]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/scope-setup
      - run: mise run check:${{ matrix.package }}

  test:
    if: github.repository == 'sdnit-se/scope'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: front, shard: 1/3 }
          - { package: front, shard: 2/3 }
          - { package: front, shard: 3/3 }
          - { package: server, shard: 1/4 }
          - { package: server, shard: 2/4 }
          - { package: server, shard: 3/4 }
          - { package: server, shard: 4/4 }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/scope-setup
      - run: mise run test:${{ matrix.package }} ${{ matrix.shard }}

  integration:
    if: github.repository == 'sdnit-se/scope'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    services:
      postgres:
        image: docker.io/library/postgres:16@sha256:485935f94cc7165afa896978809c37b592dc07f0a37d2c8f645f12412d0212c8
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
      redis:
        image: docker.io/library/redis:7.4@sha256:e2debfb7956fa12c7ddc79d7e645c8cf26b30c99a6e9161ea9bf4171e1668a5f
        ports: ["6379:6379"]
      clickhouse:
        image: docker.io/clickhouse/clickhouse-server:25.8.8@sha256:36eac5608fa3c9cdf00799266918f274201319f99e6252425cf81894cf74b34f
        env:
          CLICKHOUSE_PASSWORD: clickhousePassword
        ports: ["8123:8123"]
        options: --health-cmd "clickhouse-client --password=clickhousePassword --query='SELECT 1'" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/scope-setup
      - run: mise run test:server-integration ${{ matrix.shard }}

  image:
    if: github.repository == 'sdnit-se/scope'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: docker build --target twenty --file packages/twenty-docker/twenty/Dockerfile --tag scope-twenty .
      - run: docker image ls scope-twenty
