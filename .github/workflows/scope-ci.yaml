name: Scope CI

# Never add pull_request or pull_request_target: Scope is public, and only
# people with write access may run code here. Their branches trigger push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Lower this as each area is removed; it reaches 0 when the work is done.
  ENTERPRISE_FILES_MAX: 597

jobs:
  enterprise-code:
    if: github.repository == 'sdnit-se/scope'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: scripts/check-no-enterprise-code.sh --max "$ENTERPRISE_FILES_MAX"

  shared:
    if: github.repository == 'sdnit-se/scope'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/yarn-install
      - run: npx nx build twenty-shared
      - run: npx nx run-many -t lint typecheck test -p twenty-shared

  front:
    if: github.repository == 'sdnit-se/scope'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: '--max-old-space-size=10240'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/yarn-install
      - run: npx nx build twenty-shared
      - run: npx nx reset:env twenty-front
      - run: npx nx run-many -t lint typecheck -p twenty-front
      - run: npx nx build twenty-front

  front-test:
    if: github.repository == 'sdnit-se/scope'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: '--max-old-space-size=6144'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/yarn-install
      - run: npx nx build twenty-shared
      - run: npx nx reset:env twenty-front
      - run: npx nx test twenty-front --shard=${{ matrix.shard }}/3

  server:
    if: github.repository == 'sdnit-se/scope'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/yarn-install
      - run: npx nx build twenty-shared
      - run: npx nx reset:env twenty-server
      - run: npx nx run-many -t lint typecheck -p twenty-server
      - run: npx nx build twenty-server

  server-test:
    if: github.repository == 'sdnit-se/scope'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/yarn-install
      - run: npx nx build twenty-shared
      - run: npx nx run twenty-server:test:ci --shard=${{ matrix.shard }}/4
