name: Scope CI

# Never add pull_request or pull_request_target: Scope is public, and only
# people with write access may run code here. Their branches trigger push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Lower this as each area is removed; it reaches 0 when the work is done.
  ENTERPRISE_FILES_MAX: 597

jobs:
  enterprise-code:
    if: github.repository == 'sdnit-se/scope'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: 2026.10.23
          install: false
      - run: mise run enterprise:check --max "$ENTERPRISE_FILES_MAX"

  check:
    if: github.repository == 'sdnit-se/scope'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package: [shared, front, server]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/scope-setup
      - run: mise run check:${{ matrix.package }}

  test:
    if: github.repository == 'sdnit-se/scope'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: front, shard: 1/3 }
          - { package: front, shard: 2/3 }
          - { package: front, shard: 3/3 }
          - { package: server, shard: 1/4 }
          - { package: server, shard: 2/4 }
          - { package: server, shard: 3/4 }
          - { package: server, shard: 4/4 }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/scope-setup
      - run: mise run test:${{ matrix.package }} ${{ matrix.shard }}
